name: Daily News Digest

on:
  schedule:
    # 毎朝 JST 6:00 (UTC 21:00 前日)
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  build-digest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install obsidian-headless
        run: npm install -g obsidian-headless

      - name: Fetch RSS feeds
        run: python tasks/news-digest/scripts/fetch_rss.py

      - name: Summarize articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tasks/news-digest/scripts/summarize.py

      - name: Save to Obsidian
        env:
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
          OBSIDIAN_VAULT_NAME: ${{ secrets.OBSIDIAN_VAULT_NAME }}
          OBSIDIAN_VAULT_PASSWORD: ${{ secrets.OBSIDIAN_VAULT_PASSWORD }}
          OBSIDIAN_VAULT_PATH: /tmp/obsidian-vault
        run: |
          ob login --email "$OBSIDIAN_EMAIL" --password "$OBSIDIAN_PASSWORD"
          mkdir -p /tmp/obsidian-vault
          ob sync-setup \
            --vault "$OBSIDIAN_VAULT_NAME" \
            --path /tmp/obsidian-vault \
            --password "$OBSIDIAN_VAULT_PASSWORD" \
            --device-name github-actions
          ob sync-config \
            --path /tmp/obsidian-vault \
            --excluded-folders "notes,logs,inbox,_templates,_base,_excalidraw"
          python tasks/news-digest/scripts/save_to_obsidian.py
          ob sync --path /tmp/obsidian-vault
          rm -rf /tmp/obsidian-vault
